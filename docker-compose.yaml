services:
  mongo-db:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - interview-ai-app-network
  backend:
    build: ./backend
    container_name: backend
    restart: always
    environment:
      - MONGO_URI=mongodb://mongodb:27017/interview-ai-app
      - GOOGLE_GENAI_API_KEY=YOUR_GEMINI_API_KEY
      - JWT_SECRET=super-secret-key
    ports:
      - "3000:3000"
    networks:
      - interview-ai-app-network
    depends_on:
      - mongo-db
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "5173:5173"
    networks:
      - interview-ai-app-network
    depends_on:
      - backend

volumes:
  mongo-data:

networks:
  interview-ai-app-network:
    driver: bridge